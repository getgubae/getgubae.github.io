<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>የመዝሙር ግጥሞች በአማርኛ — Amharic Mezmur Lyrics | Gubae</title>
<meta name="description" content="በሺዎች የሚቆጠሩ የአማርኛ መዝሙሮች ግጥም — በአልበም፣ በዘማሪ ወይም በመዝሙር ይፈልጉ። Thousands of Amharic mezmur lyrics by album, by singer or by song.">
<link rel="canonical" href="https://getgubae.com/lyrics/">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0f0a1e">
<link rel="icon" href="images/app-icon.webp">
<link rel="stylesheet" href="styles.css?v=9ff3d66d">
<script>try{var t=localStorage.getItem("gubae.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>
<main class="reader">
  <div class="wrap narrow">
    <p class="loading">&hellip;</p>
    <noscript>
      <p class="chapter-sub" style="border:0;padding:0">
        <a href="lyrics/">መዝሙሮች &mdash; every singer and every hymn &rarr;</a>
      </p>
    </noscript>
  </div>
</main>
<script>
(function () {
  'use strict';

  function go() {
    var h = location.hash;

    /* No address to read: /lyrics/ is where the hymns are. */
    if (!h || h === '#') { location.replace('lyrics/'); return; }
    if (h === '#/singers') { location.replace('lyrics/'); return; }
    if (h === '#/songs') { location.replace('songs/'); return; }
    if (h === '#/albums') { location.replace('albums/'); return; }

    /* Anything else needs the list to turn a number into a name. */
    fetch('data/songs/index.json?v=2936567d')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var m = /^#\/a\/(\d+)\/(\d+)/.exec(h);
        if (m) {
          var a = d.artists[+m[1]];
          for (var i = 0; i < d.songs.length; i++) {
            if (d.songs[i].a === +m[1] && d.songs[i].i === +m[2] && a && a.slug) {
              location.replace('lyrics/' + a.slug + '/' + d.songs[i].sl + '/');
              return;
            }
          }
        }
        m = /^#\/a\/(\d+)/.exec(h);
        if (m && d.artists[+m[1]] && d.artists[+m[1]].slug) {
          location.replace('lyrics/' + d.artists[+m[1]].slug + '/');
          return;
        }
        m = /^#\/al\/(\d+)/.exec(h);
        if (m && d.albums[+m[1]] && d.albums[+m[1]].slug) {
          location.replace('albums/' + d.albums[+m[1]].slug + '/');
          return;
        }
        location.replace('lyrics/');
      })
      .catch(function () { location.replace('lyrics/'); });
  }

  window.addEventListener('hashchange', go);
  go();
}());
</script>
</body>
</html>

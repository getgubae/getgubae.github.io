<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gubae</title>
<style>
:root { color-scheme: light dark; --ink:#181b33; --muted:#3c3850; --bg:#f8f7fb;
        --line:#ddd9ea; --brand:#3b2e7e; }
@media (prefers-color-scheme: dark) {
  :root { --ink:#fff; --muted:#cdc8e0; --bg:#100b1e; --line:#2a2340; --brand:#e0a458; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); line-height:1.65;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header.hero { position:relative; overflow:hidden; padding:72px 20px 64px;
  background:linear-gradient(140deg,#2b1f4a 0%,#191130 55%,#100b1e 100%); }
header.hero::before { content:""; position:absolute; inset:-40% -20% auto -20%;
  height:150%; border-radius:50%; border:1px solid rgba(224,164,88,.22); }
.hero-inner { position:relative; max-width:720px; margin:0 auto; }
.hero img { height:64px; display:block; }
.hero p { margin:16px 0 0; color:#cdc8e0; }
main { max-width:720px; margin:0 auto; padding:34px 20px 80px; }
a.card { display:block; padding:18px 20px; margin-bottom:12px; border-radius:16px;
  border:1px solid var(--line); color:var(--ink); text-decoration:none; font-weight:600; }
a.card span { display:block; font-weight:400; color:var(--muted); font-size:.95rem; }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <img src="gubae-wordmark.png" alt="Gubae">
    <p>Word, Melody, Community. All Here.</p>
  </div>
</header>
<main>
  <a class="card" href="privacy.html">Privacy policy
    <span>What Gubae keeps, and what it does not</span></a>
  <a class="card" href="terms.html">Terms of use
    <span>What you agree to when you use Gubae</span></a>
</main>
</body>
</html>

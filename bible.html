<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>መጽሐፍ ቅዱስ በአማርኛ ያንብቡ — Amharic Bible Online | Gubae</title>
<meta name="description" content="ሙሉ መጽሐፍ ቅዱስ፣ 66ቱም መጻሕፍት፣ በአማርኛ (የ1954 ትርጉም) እና በእንግሊዝኛ። በነፃ ያንብቡ፣ ይፈልጉ፣ ለእያንዳንዱ ምዕራፍ አገናኝ አለው። Read the whole Bible in Amharic and English, free, with search.">
<link rel="canonical" href="https://getgubae.com/bible/">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0f0a1e">
<link rel="icon" href="images/app-icon.webp">
<link rel="stylesheet" href="styles.css?v=36720bdf">
<script>try{var t=localStorage.getItem("gubae.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>
<main class="reader">
  <div class="wrap narrow">
    <p class="loading" id="where">&hellip;</p>
    <noscript>
      <p class="chapter-sub" style="border:0;padding:0">
        <a href="bible/">መጽሐፍ ቅዱስ &mdash; the Bible, all 66 books &rarr;</a>
      </p>
    </noscript>
  </div>
</main>
<script>
(function () {
  'use strict';

  /* Where the reader asked for, in the address they arrived with. */
  function asked() {
    var m = /^#\/(\d+)\/(\d+)(?:\/(\d+))?/.exec(location.hash);
    if (m) return { order: +m[1], chapter: +m[2], verse: m[3] ? +m[3] : null };
    try {
      var saved = (localStorage.getItem('gubae.place') || '').split('/');
      if (saved.length === 2 && +saved[0]) {
        return { order: +saved[0], chapter: +saved[1], verse: null };
      }
    } catch (e) { /* no storage: Genesis 1 it is */ }
    return { order: 1, chapter: 1, verse: null };
  }

  function go() {
    var want = asked();
    fetch('data/bible/index.json?v=602ec596')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var b = null;
        for (var i = 0; i < d.books.length; i++) {
          if (d.books[i].order === want.order) { b = d.books[i]; break; }
        }
        if (!b || !b.slug) { location.replace('bible/'); return; }
        location.replace('bible/' + b.slug + '/' + want.chapter + '/' +
          (want.verse ? '#v' + want.verse : ''));
      })
      .catch(function () { location.replace('bible/'); });
  }

  window.addEventListener('hashchange', go);
  go();
}());
</script>
</body>
</html>
